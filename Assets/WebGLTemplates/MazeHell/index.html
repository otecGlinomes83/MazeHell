<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#100605; }
    canvas { display:block; width:100vw; height:100vh; outline:none; touch-action:none; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; gap:20px; color:#d9cbbb; background:#100605; font:20px monospace; text-align:center; pointer-events:none; }
    progress { width:240px; height:8px; accent-color:#ff7326; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="MazeHell"></canvas>
  <div id="loading"><strong>MAZEHELL</strong><progress id="progress" max="1" value="0"></progress></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    if (canvas.requestPointerLock) {
      const requestPointerLock = canvas.requestPointerLock.bind(canvas);
      canvas.requestPointerLock = (...options) => {
        const request = requestPointerLock(...options);
        if (request && request.catch) {
          return request.catch(error => console.warn("Pointer lock unavailable:", error.name));
        }
        return request;
      };
    }
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    }, progress => {
      document.querySelector("#progress").value = progress;
    }).then(() => {
      loading.remove();
      canvas.focus();
    }).catch(error => {
      loading.textContent = String(error);
      console.error(error);
    });
  </script>
</body>
</html>
